# Local, zero-cost replica of the AWS topology:   nginx (stand-in for the NLB)  ->  3 gateways  ->  Redis
#   docker compose up --build         then open http://localhost:8080 in two tabs
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 2s, retries: 10 }

  gw1: &gw
    build: .
    image: ws-backplane-gw:latest
    environment: &env
      NODE_ID: gw1
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or environment}
      DEV_TOKENS: ${DEV_TOKENS:-false}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env or environment}
    depends_on: { redis: { condition: service_healthy } }
  gw2:
    <<: *gw
    environment: { <<: *env, NODE_ID: gw2 }
  gw3:
    <<: *gw
    environment: { <<: *env, NODE_ID: gw3 }

  lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [gw1, gw2, gw3]

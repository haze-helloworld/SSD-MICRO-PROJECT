# Local stand-in for an AWS Network Load Balancer (L7 here only because nginx has to speak the Upgrade handshake;
# the NLB itself is plain L4/TCP and needs no such config).
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream gateways {
    ip_hash;                          # Sticky client session by IP so UI polling hits the same node
    server gw1:8080 max_fails=1 fail_timeout=2s;
    server gw2:8080 max_fails=1 fail_timeout=2s;
    server gw3:8080 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;       # long-lived sockets
      proxy_send_timeout 3600s;
    }
  }
}
